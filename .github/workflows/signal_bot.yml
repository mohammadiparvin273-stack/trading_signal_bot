name: Trading Signal Bot

# Runs "python main.py once" on a schedule using GitHub's free runners.
# This is the RIGHT fit for this project: the bot does one pass (fetch
# data -> analyze -> notify) and exits — exactly what a scheduled CI job
# is built for. No server, no Vercel, no cost.
#
# NOTE on frequency: GitHub Actions cannot run more often than every
# 5 minutes, and schedules can slip a few minutes (more during high
# platform load) — that's a GitHub-wide limit, not something this repo
# controls. For an intraday/swing signal bot (1h timeframe) this is
# more than enough precision.
#
# NOTE on state: each run starts on a brand-new, empty machine. To keep
# "don't re-send the same signal" working, and to let market data
# accumulate for the ML/DL models instead of being thrown away every
# run, this workflow commits storage/ (signal state + persisted OHLCV
# history + run log) and the generated docs/index.html dashboard back
# to the repo after every run.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (adjust as you like, min 5)
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit the updated state file back

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one signal pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Only ever put READ-ONLY exchange keys here, if you use any at all.
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
        run: python main.py once

      - name: Rebuild the dashboard
        run: python main.py dashboard

      - name: Persist state, history & dashboard
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add storage/signal_state.json storage/run_log.jsonl storage/history docs/index.html
          git diff --quiet --cached || git commit -m "Update signals, data & dashboard [skip ci]"
          git push
